name: AI Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Collect changed files
        run: |
          git diff --name-only --diff-filter=ACMR \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" > /tmp/changed-files.txt

      - name: Prepare PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > /tmp/pr-body.md

      - name: Run PR gate in report mode
        run: |
          node scripts/ai/pr-gate.mjs \
            --mode report \
            --changed-files-file /tmp/changed-files.txt \
            --pr-body-file /tmp/pr-body.md \
            --output-file /tmp/pr-gate.json

      - name: Upsert PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs')

            const marker = '<!-- ai-review -->'
            const issueNumber = context.issue.number
            const { owner, repo } = context.repo
            const gate = JSON.parse(fs.readFileSync('/tmp/pr-gate.json', 'utf8'))

            const errorSection = gate.errors.length
              ? gate.errors.map((error) => `- ${error}`).join('\n')
              : '- none'
            const warningSection = gate.warnings.length
              ? gate.warnings.map((warning) => `- ${warning}`).join('\n')
              : '- none'
            const reasonSection = gate.gateReasons.length
              ? gate.gateReasons.map((reason) => `- ${reason}`).join('\n')
              : '- none'

            const body = `${marker}
            ## 🛡️ PR Guard

            이 코멘트는 PR 본문의 workflow 근거를 확인하기 위한 경량 검수입니다.
            blocking check는 별도 \`Workflow Gate\`가 담당합니다.

            ### Gate 대상
            - ${gate.isEnforcedLargeChange ? 'yes' : 'no'}

            ### Gate 이유
            ${reasonSection}

            ### Hard errors
            ${errorSection}

            ### Warnings
            ${warningSection}
            `

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
            })

            const existingComment = comments.find((comment) => {
              return comment.user?.type === 'Bot' && comment.body?.includes(marker)
            })

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body,
              })
              return
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body,
            })
